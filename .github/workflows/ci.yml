name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the checks only read the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag, so pin the exact release by SHA.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date instead of silently re-resolving.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      # Full history, so a secret committed and then deleted is still caught.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments would need pull-requests: write; the failing check is enough.
          GITLEAKS_ENABLE_COMMENTS: false
