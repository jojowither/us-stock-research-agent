[project]
name = "stock-agent"
version = "0.1.0"
description = "An LLM agent that answers US stock research questions from SEC filings."
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.2.5",
    "google-auth>=2.63.1",
    "pydantic-ai-slim[google,mcp]>=2.73.0",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
stock-agent = "stock_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
# A new Auth variant without a branch in build_model fails the check.
reportMatchNotExhaustive = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
