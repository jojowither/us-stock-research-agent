[project]
name = "stock-agent"
version = "0.1.0"
description = "An LLM agent that answers US stock research questions from SEC filings."
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.2.5",
    "pydantic-ai-slim[google,mcp]>=2.73.0",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
stock-agent = "stock_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
